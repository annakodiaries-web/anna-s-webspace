<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Annako</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe6ee;--paper:#fffafc;--ink:#2a1622;--pink:#ff6f9f;--matcha:#cfe86a;--line:1.5px solid var(--ink);--pop:0 6px 18px rgba(42,22,34,.10)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'Figtree',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px;-webkit-text-size-adjust:100%}
main{max-width:520px}
h1{font:800 clamp(44px,13vw,92px)/.92 'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.02em}
h1 mark{background:var(--matcha);padding:0 .12em;border-radius:.25em;display:inline-block}
p{margin:18px 0 22px;font-size:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:var(--line);border-radius:99px;background:var(--pink);color:var(--ink);font:700 16px 'Figtree',sans-serif;text-decoration:none;box-shadow:var(--pop)}
.btn.alt{background:var(--paper)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Oops, <mark>lost</mark> page.</h1>
  <p>That page doesn't exist. Try the portfolio or the free creator template instead.</p>
  <div class="cta">
    <a class="btn" href="/">Back to Annako</a>
    <a class="btn alt" href="/template/">Free portfolio template</a>
  </div>
</main>
</body>
</html>
